# FILE: ./railway.toml

[build]
builder = "NIXPACKS"
rootDir = "./apps/api"

[build.nixpacksConfig]
# <<< ADD THIS LINE >>>
# Explicitly tell Nixpacks which package manager to use
pkgManager = "pnpm"

# Keep the explicit install command to ensure it runs from the root
# This handles the workspace installation correctly.
installCommand = "cd ../.. && pnpm install --frozen-lockfile"

# Keep the explicit build command using turbo
buildCommand = "cd ../.. && pnpm turbo run build --filter=@fedjobs/api..."

# startCommand = "node dist/index.js" # Usually detected automatically by Nixpacks

# aptPkgs = [] # Add OS packages only if needed for build

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/" # Adjust if you have a specific health endpoint
healthcheckTimeout = 15